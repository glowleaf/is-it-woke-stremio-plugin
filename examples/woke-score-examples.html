<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Woke Score - real rows</title>
<style>
  body { margin:0; font-family: inherit; color: var(--foreground); }
  table { border-collapse: collapse; width: 100%; }
  caption { text-align:left; font-size:12px; color: var(--muted-foreground); padding: 0 0 10px 2px; }
  th { text-align:left; font-size: 11px; letter-spacing:.08em; text-transform:uppercase; color: var(--muted-foreground);
       font-weight:600; padding: 6px 14px 6px 2px; border-bottom:1px solid var(--border); white-space:nowrap; }
  td { padding: 9px 14px 9px 2px; border-bottom:1px solid var(--border); vertical-align: middle; font-size: 13.5px; }
  td.title { white-space: nowrap; font-weight:600; }
  td.title small { display:block; font-weight:400; color: var(--muted-foreground); font-size:11.5px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .chip { border:1px solid var(--border); border-radius:999px; padding:3px 10px; white-space:nowrap; background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .overall { font-weight:700; border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .none { color: var(--muted-foreground); font-style: italic; border-style: dashed; }
  .lbl { font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color: var(--muted-foreground); }
  td.spread { white-space:nowrap; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<table>
  <caption>Real rows, pulled live from https://scrut.greekai.gr/woke/... on 13 Oct 2026. Stremio renders these under the rating, above GENRES.</caption>
  <thead>
    <tr><th style="width:230px">Title</th><th>The row as Stremio shows it</th><th style="width:110px">Spread</th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<script>
const DATA = [
 ["Dune (2021)", "movie / tt1160419", ["⭐|40%|overall", "🟨|Is It Woke or Not? 39%|", "🟨|isitwoke.io 21%|", "🟨|Wokeometer 30%|", "🟥|Wokealyzer 70%|"], "49"],
 ["Dune: Part Two", "movie / tt15239678", ["⭐|38%|overall", "🟧|Is It Woke or Not? 42%|", "🟩|isitwoke.io 20%|", "🟨|Wokeometer 30%|", "🟧|Wokealyzer 58%|"], "38"],
 ["Barbie", "movie / tt1517268", ["⭐|88%|overall", "⬛|Is It Woke or Not? 96%|", "🟥|isitwoke.io 76%|", "⬛|Wokeometer 90%|", "⬛|Wokealyzer 90%|"], "20"],
 ["The Matrix (1999)", "movie / tt0133093", ["⭐|25%|overall", "|Is It Woke or Not? not reviewed|none", "🟨|isitwoke.io 24%|", "🟨|Wokeometer 20%|", "🟨|Wokealyzer 30%|"], "10"],
 ["Oppenheimer", "movie / tt15398776", ["⭐|18%|overall", "🟨|Is It Woke or Not? 24%|", "🟩|isitwoke.io 16%|", "🟩|Wokeometer 10%|", "🟨|Wokealyzer 20%|"], "14"],
 ["Boss Level", "movie / tt7638348", ["⭐|0%|overall", "🟩|Is It Woke or Not? 0%|", "|isitwoke.io not rated|none", "🟩|Wokeometer 0%|", "|Wokealyzer not rated|none"], "-"],
 ["She-Hulk: Attorney at Law", "series / tt10857160", ["⭐|94%|overall", "⬛|Is It Woke or Not? 92%|", "⬛|isitwoke.io 100%|", "⬛|Wokeometer 90%|", "|Wokealyzer not rated|none"], "10"],
 ["The Boys", "series / tt1190634", ["⭐|67%|overall", "⬛|Is It Woke or Not? 94%|", "🟨|isitwoke.io 30%|", "🟥|Wokeometer 60%|", "⬛|Wokealyzer 85%|"], "64"],
 ["Game of Thrones", "series / tt0944947", ["⭐|34%|overall", "|Is It Woke or Not? not reviewed|none", "🟨|isitwoke.io 25%|", "🟨|Wokeometer 20%|", "🟧|Wokealyzer 58%|"], "38"],
 ["Dexter", "series / tt0773262", ["⭐|19%|overall", "|Is It Woke or Not? not reviewed|none", "🟩|isitwoke.io 13%|", "🟩|Wokeometer 10%|", "🟨|Wokealyzer 33%|"], "23"],
 ["The Wizard of Oz (1939)", "movie / tt0032138", ["⭐|12%|overall", "|Is It Woke or Not? not reviewed|none", "🟩|isitwoke.io 4%|", "|Wokeometer not rated|none", "🟨|Wokealyzer 20%|"], "16"]
];
const tbody = document.getElementById('rows');
for (const [title, sub, chips, spread] of DATA) {
  const tr = document.createElement('tr');
  const td1 = document.createElement('td');
  td1.className = 'title';
  td1.innerHTML = title + '<small>' + sub + '</small>';
  const td2 = document.createElement('td');
  const wrap = document.createElement('div');
  wrap.className = 'chips';
  for (const c of chips) {
    const [mark, text, kind] = c.split('|');
    const el = document.createElement('span');
    el.className = 'chip' + (kind === 'overall' ? ' overall' : '') + (kind === 'none' ? ' none' : '');
    el.textContent = (mark ? mark + ' ' : '') + text;
    wrap.appendChild(el);
  }
  td2.appendChild(wrap);
  const td3 = document.createElement('td');
  td3.className = 'spread';
  td3.textContent = spread === '-' ? '—' : '±' + spread;
  tr.append(td1, td2, td3);
  tbody.appendChild(tr);
}
</script>
</body>
</html>
