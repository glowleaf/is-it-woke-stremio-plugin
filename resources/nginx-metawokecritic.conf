# MetaWokeCritic — PHP + SQLite front end behind the relay-loveisbitcoin tunnel.
# Pages are rendered by app/index.php from data/site.db and cached in data/cache.
server {
    listen 127.0.0.1:7091;
    server_name metawokecritic.com www.metawokecritic.com;

    root /var/www/mwc-app;
    index index.php;
    charset utf-8;

    gzip on;
    gzip_types text/html text/css application/xml application/json image/svg+xml;
    gzip_min_length 1024;

    # posters live outside the app root
    location /img/ {
        alias /var/www/metawokecritic/img/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Stremio addon (systemd: woke-addon on :7090) at the ROOT of its own domain: the manifest is
    # metawokecritic.com/manifest.json and a configured install is /<base64url config>/manifest.json.
    # Config segments always start with eyJ (base64url of '{"'), so they cannot collide with pages.
    location = /manifest.json { proxy_pass http://127.0.0.1:7090; include /etc/nginx/snippets/mwc-proxy.conf; }
    location = /health        { proxy_pass http://127.0.0.1:7090; include /etc/nginx/snippets/mwc-proxy.conf; }
    location = /configure     { proxy_pass http://127.0.0.1:7090; include /etc/nginx/snippets/mwc-proxy.conf; }
    location = /install       { proxy_pass http://127.0.0.1:7090; include /etc/nginx/snippets/mwc-proxy.conf; }
    location = /api/preview   { proxy_pass http://127.0.0.1:7090; include /etc/nginx/snippets/mwc-proxy.conf; }
    location ~ ^/eyJ[A-Za-z0-9_-]+/ { proxy_pass http://127.0.0.1:7090; include /etc/nginx/snippets/mwc-proxy.conf; }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SITE_DB /var/www/mwc-app/data/site.db;
        fastcgi_param SITE_CACHE /var/www/mwc-app/data/cache;
    }

    location ~ /\. { deny all; }

    access_log /var/log/nginx/metawokecritic.access.log;
    error_log /var/log/nginx/metawokecritic.error.log;
}
